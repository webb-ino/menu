<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nature’s Cafe, Mopka: Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&display=swap">
<style>
:root{--bg:#f3f6ee;--card:#fff;--ink:#17211a;--mut:#5f6c61;--line:#dfe6d6;--g:#24492f;--on:#fff;--gl:#e1ecd6;--amb:#b97a10;--red:#a8382a;--grn:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111912;--card:#1a251c;--ink:#eaf0e3;--mut:#9fae9f;--line:#2a392d;--g:#7fb98a;--on:#0e1a10;--gl:#243a2a;--amb:#e0a33a;--red:#e0705f;--grn:#6fbf73}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
.wrap{max-width:640px;margin:0 auto;padding-bottom:90px}
.top{background:var(--g);color:var(--on);padding:16px 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:700 24px/1.1 Fraunces,Georgia,serif;margin:0}
.brand{display:flex;align-items:center;gap:12px}.brand h1{font-size:19px;letter-spacing:.09em;text-transform:uppercase}.brand p{letter-spacing:.1em;text-transform:uppercase;font-size:11px!important}
.top p{margin:2px 0 0;font-size:13px;opacity:.85}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.pri{background:var(--g);color:var(--on);border-color:var(--g);font-weight:600}
.top button{background:transparent;color:var(--on);border-color:currentColor}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 16px 6px;border-bottom:1px solid var(--line)}
input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:999px;padding:5px 13px;font-size:14px}
.chips button.on{background:var(--gl);border-color:var(--g);font-weight:600}
h2{font:700 21px/1.2 Fraunces,Georgia,serif;margin:22px 16px 6px;color:var(--g)}
.it{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.dot{width:14px;height:14px;border:2px solid var(--grn);border-radius:3px;flex:none;position:relative}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--grn)}
.dot.n{border-color:var(--red)}.dot.n::after{background:var(--red)}.dot.x{visibility:hidden}
.nm{flex:1}.pr{color:var(--mut);font-size:14px}
.qty{display:flex;align-items:center;gap:10px;border:1px solid var(--g);border-radius:8px;padding:2px 4px}
.qty button{border:0;background:none;font-size:18px;padding:2px 10px}
.bar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:10px 16px;z-index:6}
.bar button{width:100%;display:flex;justify-content:space-between;padding:13px 16px;border-radius:10px}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh>div{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.st{display:flex;gap:6px;margin:14px 0}.st span{flex:1;text-align:center;padding:8px 2px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.st span.on{background:var(--g);color:var(--on);border-color:var(--g);font-weight:600}
.note{font-size:13px;color:var(--mut);margin:12px 16px}
a{color:var(--g)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,addDoc,doc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDBt-TV4u8jJClK9wFbSfFymgQAqiCJeGE",
  authDomain:"cafe-menu-289b7.firebaseapp.com",
  projectId:"cafe-menu-289b7",
  storageBucket:"cafe-menu-289b7.firebasestorage.app",
  messagingSenderId:"675538504432",
  appId:"1:675538504432:web:36bae4b397dd7999cd9035"
});
const db=getFirestore(app);

/* ---------- MENU DATA: one line per item as Name|price|type (v = veg, n = non-veg). A line with no | is a category. ---------- */
const D=`Beverages
Mineral Water|20
Soft Drink / Masala|40
Butter Milk|60
Red Bull|180
Coolbarg|150
Mocktails
Virgin Mojito|120
Watermelon Mojito|120
Strawberry Mojito|120
Kiwi Cooler|130
Green Apple Cooler|90
Hibiscus Cooler|90
Berry Punch|190
Blueberry Cooler|90
No Tequila (Shots)|220
Pina Colada|169
Chilli Guava (Shots)|220
Sunset Berry|140
Tropical Tiger|160
Black Panther|160
Soups
Manchow Soup|120|v
Hot & Sour Soup|110|v
Lemon Coriander Soup|110|v
Chicken Manchow Soup|140|n
Chicken Hot & Sour Soup|130|n
Chicken Lemon Coriander Soup|130|n
Fries
French Fries|60
Peri Peri Fries|80
Schezwan Fries|90
Cheese Loaded Fries|110
Pasta
White Sauce Pasta|180|v
Red Sauce Pasta|160|v
Pink Sauce Pasta|180|v
Chicken White Sauce Pasta|210|n
Chicken Red Sauce Pasta|190|n
Chicken Pink Sauce Pasta|210|n
Chinese Appetizers
Chinese Bhel|120|v
Crispy Corn|160|v
Baby Corn Chilly|180|v
Dragon Paneer|200|v
Garlic Paneer|200|v
Paneer Chilli|180|v
Paneer 65|180|v
Mushroom Salt & Pepper|180|v
Honey Chilly Potato|160|v
Veg Lollipop|180|v
Chicken Pops|180|n
Chicken Roast|160|n
Chicken Cornflakes|180|n
Grilled Chicken|220|n
Chicken Pakoda|180|n
Rice
Veg Fried Rice|120|v
Chilli Garlic Fried Rice|130|v
Burn Garlic Rice|130|v
Schezwan Fried Rice|130|v
Triple Schezwan Fried Rice|180|v
Chicken Fried Rice|150|n
Chicken Garlic Fried Rice|150|n
Chicken Burn Garlic Rice|150|n
Chicken Schezwan Fried Rice|160|n
Chicken Triple Schezwan Fried Rice|220|n
Noodles
Veg Noodles|110|v
Chilli Garlic Noodles|120|v
Burn Garlic Noodles|130|v
Schezwan Fried Noodles|130|v
Chicken Noodles|150|n
Chicken Chilli Garlic Noodles|150|n
Chicken Burn Garlic Noodles|150|n
Chicken Schezwan Fried Noodles|150|n
Gravy Favourites
Paneer Chilli Gravy|220|v
Paneer Hot Garlic Sauce|220|v
Paneer Manchurian Gravy|210|v
Chicken Chilli Gravy|280|n
Chicken Hot Garlic Sauce|280|n
Chicken Manchurian Gravy|280|n
Desserts
Ice Cream|60
Brownie with Ice-Cream|110
Hot Sizzling Brownie|140
Gulab Jamun|40
Fried Icecream|110`;

const cats=[],all={};
D.split('\n').forEach(l=>{if(l.includes('|')){const[n,p,t]=l.split('|'),c=cats[cats.length-1],o={id:cats.length-1+'_'+c.items.length,n,p:+p,t:t||''};c.items.push(o);all[o.id]=o}else cats.push({n:l,items:[]})});

const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const rs=n=>n?'₹'+n:'MRP';
const STEPS=['New','Preparing','Ready','Served'];
const LOGO='<svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" role="img" aria-label="Nature’s Cafe logo"><path d="M5 38A19 19 0 0 1 43 38"/><path d="M24 11c-8 4-9 14 0 22 9-8 8-18 0-22z" fill="currentColor" stroke="none"/><path d="M24 17v16" stroke="var(--g)" stroke-width="1.4"/><path d="M10 40h28" stroke-width="1" opacity=".6"/></svg>';

let cart={},fl='all',q='',me=null,tbl='',fromQr=false,unsub=null;
try{me=localStorage.getItem('nc_me')}catch(e){}
const T=new URLSearchParams(location.search).get('table');
if(T&&/^\d{1,3}$/.test(T)){tbl=T;fromQr=true}
const total=()=>Object.keys(cart).reduce((s,k)=>s+all[k].p*cart[k],0);
const count=()=>Object.keys(cart).reduce((s,k)=>s+cart[k],0);

function menu(){
  $('#app').innerHTML=`<div class="top"><div class="brand">${LOGO}<div><h1>Nature’s Cafe</h1><p>Mopka · ${fromQr?'Table '+E(tbl):'scan, order, enjoy'}</p></div></div><button id="ob">My order</button></div>
  <div class="sticky"><input id="q" type="search" placeholder="Search the menu" aria-label="Search the menu" value="${E(q)}">
  <div class="chips" id="f"></div><div class="chips" id="cn"></div></div>
  <div id="list"></div><div id="bar"></div><div id="sh"></div>`;
  $('#q').oninput=e=>{q=e.target.value;list()};
  $('#f').innerHTML=[['all','All'],['v','Veg'],['n','Non-veg']].map(([k,t])=>`<button data-f="${k}" class="${fl===k?'on':''}">${t}</button>`).join('');
  $('#f').onclick=e=>{const k=e.target.dataset.f;if(k){fl=k;menu()}};
  $('#cn').innerHTML=cats.map((c,i)=>`<button data-c="${i}">${E(c.n)}</button>`).join('');
  $('#cn').onclick=e=>{const i=e.target.dataset.c;if(i!=null){const h=document.getElementById('c'+i);h&&h.scrollIntoView({behavior:'smooth'})}};
  $('#ob').onclick=status;
  $('#list').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;cart[id]=Math.max(0,(cart[id]||0)+(a==='+'?1:-1));if(!cart[id])delete cart[id];list();bar()};
  list();bar();
}
function list(){
  const s=q.trim().toLowerCase();let h='';
  cats.forEach((c,i)=>{
    const its=c.items.filter(o=>o.n.toLowerCase().includes(s)&&(fl==='all'||(fl==='v'&&o.t!=='n')||(fl==='n'&&o.t==='n')));
    if(!its.length)return;
    h+=`<h2 id="c${i}">${E(c.n)}</h2>`+its.map(o=>`<div class="it"><span class="dot ${o.t||'x'}" title="${o.t==='v'?'Veg':o.t==='n'?'Non-veg':''}"></span><span class="nm">${E(o.n)}</span><span class="pr">${rs(o.p)}</span>${cart[o.id]?`<span class="qty"><button data-a="-" data-id="${o.id}" aria-label="Remove one">−</button><b>${cart[o.id]}</b><button data-a="+" data-id="${o.id}" aria-label="Add one">+</button></span>`:`<button data-a="+" data-id="${o.id}">Add</button>`}</div>`).join('');
  });
  $('#list').innerHTML=h||'<p class="note">Nothing matches that search. Try a different word.</p>';
}
function bar(){
  const n=count();
  $('#bar').innerHTML=n?`<div class="bar"><button class="pri" id="vc"><span>${n} item${n>1?'s':''}</span><span>View cart · ${rs(total())}</span></button></div>`:'';
  if(n)$('#vc').onclick=cartSheet;
}
function closeSheet(){if(unsub){unsub();unsub=null}$('#sh').innerHTML=''}
function sheet(html){$('#sh').innerHTML=`<div class="sh" id="bg"><div>${html}</div></div>`;$('#bg').onclick=e=>{if(e.target.id==='bg')closeSheet()}}
function cartSheet(){
  if(unsub){unsub();unsub=null}
  const ks=Object.keys(cart);
  sheet(`<h2 style="margin:0 0 8px">Your cart</h2>${ks.map(k=>`<div class="row"><span>${cart[k]} × ${E(all[k].n)}</span><span>${rs(all[k].p*cart[k])}</span></div>`).join('')}
  <div class="row"><b>Total</b><b>${rs(total())}</b></div>
  ${fromQr?`<p class="pr" style="margin:12px 0 0">Ordering for <b>Table ${E(tbl)}</b> · <a href="#" id="chg">Not your table?</a></p><input id="tb" type="hidden" value="${E(tbl)}">`:`<label for="tb">Table number</label><input id="tb" inputmode="numeric" maxlength="10" placeholder="For example, 5" value="${E(tbl)}">`}
  <label for="nm2">Your name (optional)</label><input id="nm2" maxlength="40">
  <label for="nt">Note for the kitchen (optional)</label><textarea id="nt" rows="2" maxlength="200" placeholder="Less spicy, no onion…"></textarea>
  <p id="er" style="color:var(--red);margin:8px 0 0"></p>
  <button class="pri" id="po" style="width:100%;margin-top:12px;padding:12px">Place order</button><p class="note" style="margin:8px 0 0">Pay at the counter after your meal.</p>`);
  const ch=$('#chg');if(ch)ch.onclick=e=>{e.preventDefault();fromQr=false;cartSheet()};
  $('#po').onclick=async()=>{
    tbl=$('#tb').value.trim();
    if(!tbl){$('#er').textContent='Enter your table number to place the order.';return}
    const b=$('#po');b.disabled=true;b.textContent='Placing order…';
    try{
      const r=await addDoc(collection(db,'orders'),{table:tbl,name:$('#nm2').value.trim(),note:$('#nt').value.trim(),items:Object.keys(cart).map(k=>({n:all[k].n,q:cart[k]})),total:total(),status:'New',createdAt:serverTimestamp()});
      me=r.id;try{localStorage.setItem('nc_me',me)}catch(e){}
      cart={};menu();status();
    }catch(e){b.disabled=false;b.textContent='Place order';$('#er').textContent='Could not place the order. Check your internet connection and try again.'}
  };
}
function status(){
  if(unsub){unsub();unsub=null}
  if(!me){sheet('<h2 style="margin:0 0 8px">My order</h2><p>You have not placed an order yet. Add items from the menu to get started.</p>');return}
  unsub=onSnapshot(doc(db,'orders',me),s=>{
    if(!s.exists()){sheet('<h2 style="margin:0 0 8px">My order</h2><p>We could not find this order.</p>');return}
    const o=s.data(),i=STEPS.indexOf(o.status);
    sheet(`<h2 style="margin:0">Order ${E(me.slice(-4).toUpperCase())}</h2><p class="pr" style="margin:2px 0">Table ${E(o.table)} · ${rs(o.total)}</p>
    <div class="st">${STEPS.map((x,j)=>`<span class="${j<=i?'on':''}">${x==='New'?'Received':x}</span>`).join('')}</div>
    ${o.items.map(x=>`<div class="row"><span>${E(x.q)} × ${E(x.n)}</span></div>`).join('')}
    <p class="note" style="margin:12px 0 0">${i===2?'Your order is ready.':i===3?'Enjoy your meal!':'This updates by itself.'}</p>`);
  },()=>sheet('<h2 style="margin:0 0 8px">My order</h2><p>Could not load your order. Check your internet connection.</p>'));
}
menu();
</script>
</body>
</html>
